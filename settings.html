<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - YouTube Mockup</title>
    <link rel="stylesheet" href="youtube.css">
    <link rel="stylesheet" href="youtube-extra.css">
</head>
<body>
    <header class="topbar">
        <a class="account-logo" href="youtube.html"><span class="play-icon">▶</span> YouTube</a>
        <div class="top-actions">
            <a class="plain-link" href="profile.html">Your profile</a>
        </div>
    </header>

    <main class="settings-page">
        <h1>Settings</h1>
        <p class="settings-intro">Manage your mock YouTube experience.</p>

        <section class="settings-group">
            <h2>General</h2>
            <label class="setting-row">
                <span>
                    <strong>Appearance</strong>
                    <small>Choose how YouTube looks.</small>
                </span>
                <select>
                    <option>Light theme</option>
                    <option>Dark theme (visual only)</option>
                </select>
            </label>
            <label class="setting-row">
                <span>
                    <strong>Language</strong>
                    <small>Choose the display language.</small>
                </span>
                <select>
                    <option>English</option>
                    <option>Filipino</option>
                </select>
            </label>
        </section>

        <section class="settings-group">
            <h2>Notifications</h2>
            <label class="setting-row">
                <span>
                    <strong>Recommended videos</strong>
                    <small>Show notifications about recommended videos.</small>
                </span>
                <input type="checkbox" checked>
            </label>
            <label class="setting-row">
                <span>
                    <strong>Subscriptions</strong>
                    <small>Show notifications from channels you follow.</small>
                </span>
                <input type="checkbox" checked>
            </label>
        </section>

        <a class="plain-link" href="youtube.html">← Back to Home</a>
    </main>
</body>
</html>
