<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - YouTube Mockup</title>
    <link rel="stylesheet" href="youtube.css">
    <link rel="stylesheet" href="youtube-extra.css">
    <script src="login.js" defer></script>
</head>
<body class="account-page">
    <header class="account-header">
        <a class="account-logo" href="youtube.html"><span class="play-icon">▶</span> YouTube</a>
    </header>

    <main class="account-card">
        <h1>Sign in</h1>
        <p>Continue to YouTube</p>

        <form id="login-form">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" required>

            <button type="submit">Sign in</button>
        </form>

        <p class="account-note">This is a demonstration login for the mock website.</p>
        <a href="youtube.html">Back to YouTube</a>
    </main>
</body>
</html>
